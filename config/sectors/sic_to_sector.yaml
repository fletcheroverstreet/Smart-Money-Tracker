# Fallback sector labels from SEC SIC codes, used only when a ticker is not in
# industry_map.csv (the hand-curated map copied from lodestar; its DEC-009).
#
# SIC is a 1987 taxonomy, so these are broad, honest approximations: every
# label derived here is stored with sector_source = "sic" and shown as such.
# Rules are checked top to bottom; the first range containing the code wins,
# so narrow ranges come before the broad division they belong to.
# Sector names match the 11 broad names used in industry_map.csv.

rules:
  # --- narrow exceptions first
  - {from: 2830, to: 2836, sector: Health Care}            # pharmaceuticals, biologics
