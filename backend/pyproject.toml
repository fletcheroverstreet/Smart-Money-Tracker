[project]
name = "smt"
version = "0.1.0"
description = "Smart Money Tracker backend: ingestion worker, parsers, analytics and read-only API over official public disclosures."
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Fletcher Overstreet" }]
dependencies = [
    "fastapi~=0.141.1",
    "uvicorn[standard]~=0.53.0",
    "pydantic~=2.13",
    "pydantic-settings~=2.15",
    "sqlalchemy[asyncio]~=2.0.54",
    "alembic~=1.20",
    "psycopg[binary,pool]~=3.3.6",
    "httpx~=0.28.1",
    "lxml~=6.1",
    "structlog~=26.1",
    "orjson~=3.12",
    "sse-starlette~=3.4",
    "holidays~=0.105",
    "pyyaml~=6.0",
    "duckdb~=1.5",
    # Watchdog alerts to Discord / Telegram / email (APPRISE_URLS). Empty = log only.
    "apprise~=1.13.1",
    # Daily prices for private mode only (Yahoo's terms: personal use, no public display).
    # curl_cffi is pinned too: curl_cffi 0.16 once broke yfinance (source-verification.md).
    "yfinance~=1.7",
    "curl-cffi~=0.16.3",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "respx~=0.23.1",
    "ruff~=0.16.8",
    "mypy~=2.3",
    "types-PyYAML",
    "lxml-stubs",
]

[project.scripts]
smt = "smt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smt"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs the test database (TEST_DATABASE_URL)",
    "network: talks to the real internet; skipped unless SMT_NETWORK_TESTS=1",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "PT"]
ignore = [
    "E501",    # long lines are fine in docstrings and test fixtures
    "RUF001",  # unicode glyphs (▲ ▼ –) are deliberate in user-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]
"src/smt/db/migrations/**" = ["E", "W", "I"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["smt"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["src/smt/db/migrations/"]

[[tool.mypy.overrides]]
module = ["holidays.*", "duckdb.*", "sse_starlette.*"]
ignore_missing_imports = true
